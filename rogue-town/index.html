<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rogue Town</title>

  <style>
    body {
      margin: 0;
      background: #1b1b1b;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 24px;
    }

    #info {
      margin-bottom: 6px;
      font-size: 14px;
    }

    #controls {
      margin-bottom: 8px;
      font-size: 13px;
    }

    .key-setting {
      margin-left: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #6f8f5f;
      border: 2px solid white;
    }
  </style>
</head>

<body>
  <h1>Rogue Town</h1>
    <div id="info">
    移動キーで操作 / スペースでポーズ / 敵は自動攻撃 / 2分後にボス登場
  </div>
    <div id="controls">
      <span>移動キー設定:</span>
      <button class="key-setting" data-direction="up">上: W</button>
      <button class="key-setting" data-direction="down">下: S</button>
      <button class="key-setting" data-direction="left">左: A</button>
      <button class="key-setting" data-direction="right">右: D</button>
    </div>

  <canvas id="game" width="960" height="600"></canvas>

  <script>
    // ==============================
    // 基本設定
    // ==============================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const keys = {};

    let gameOver = false;
    let gameClear = false;
    let paused = false;
    let changingKey = null;

    const moveKeys = {
      up: "w",
      down: "s",
      left: "a",
      right: "d"
    };

    let startTime = performance.now();

    let bossSpawned = false;

    // ==============================
    // プレイヤー
    // ==============================

    const player = {
      x: 480,
      y: 300,
      size: 28,

      speed: 3,

      hp: 100,
      maxHp: 100,

      exp: 0,
      level: 1,
      expToNext: 50,

      attackDamage: 20,
      attackRange: 150,
      attackInterval: 500,

      lastAttack: 0
    };

    // ==============================
    // ゲーム内オブジェクト
    // ==============================

    const enemies = [];
    const expItems = [];
    const bullets = [];
    const enemyBullets = [];

    // 街らしく見せるための建物
    const buildings = [
      { x: 80,  y: 80,  w: 170, h: 120 },
      { x: 700, y: 70,  w: 180, h: 130 },
      { x: 100, y: 400, w: 200, h: 130 },
      { x: 690, y: 390, w: 170, h: 140 }
    ];

    // ==============================
    // キーボード入力
    // ==============================

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (changingKey) {
        event.preventDefault();

        const otherDirection = Object.keys(moveKeys).find(
          (direction) => direction !== changingKey && moveKeys[direction] === key
        );

        if (!otherDirection) {
          moveKeys[changingKey] = key;
          updateKeyButtons();
          changingKey = null;
        }

        return;
      }

      if (key === " ") {
        event.preventDefault();
        paused = !paused;
        return;
      }

      keys[key] = true;

      // ゲームオーバー後にRで再スタート
      if (event.key.toLowerCase() === "r" && (gameOver || gameClear)) {
        location.reload();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    function formatKey(key) {
      const names = {
        " ": "Space",
        arrowup: "↑",
        arrowdown: "↓",
        arrowleft: "←",
        arrowright: "→"
      };

      return names[key] || key.toUpperCase();
    }

    function updateKeyButtons() {
      for (const button of document.querySelectorAll(".key-setting")) {
        const direction = button.dataset.direction;
        const labels = { up: "上", down: "下", left: "左", right: "右" };
        button.textContent = `${labels[direction]}: ${formatKey(moveKeys[direction])}`;
      }
    }

    for (const button of document.querySelectorAll(".key-setting")) {
      button.addEventListener("click", () => {
        changingKey = button.dataset.direction;
        button.textContent = "キーを入力...";
      });
    }

    // ==============================
    // プレイヤー移動
    // ==============================

    function updatePlayer() {
      if (keys[moveKeys.up]) player.y -= player.speed;
      if (keys[moveKeys.down]) player.y += player.speed;
      if (keys[moveKeys.left]) player.x -= player.speed;
      if (keys[moveKeys.right]) player.x += player.speed;

      // 画面外に出ないようにする
      player.x = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, player.x));
      player.y = Math.max(player.size / 2, Math.min(canvas.height - player.size / 2, player.y));
    }

    // ==============================
    // 敵を作る
    // ==============================

    function spawnEnemy(isBoss = false) {

      let x;
      let y;

      // 画面端から出現
      const side = Math.floor(Math.random() * 4);

      if (side === 0) {
        x = Math.random() * canvas.width;
        y = 0;
      }

      if (side === 1) {
        x = canvas.width;
        y = Math.random() * canvas.height;
      }

      if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height;
      }

      if (side === 3) {
        x = 0;
        y = Math.random() * canvas.height;
      }

      if (isBoss) {

        enemies.push({
          x,
          y,
          size: 65,
          speed: 1.1,
          hp: 800,
          maxHp: 800,
          damage: 20,
          boss: true,
          attackInterval: 1000,
          lastAttack: 0
        });

      } else {

        enemies.push({
          x,
          y,
          size: 25,
          speed: 0.8 + Math.random() * 0.6,
          hp: 40,
          maxHp: 40,
          damage: 8,
          boss: false,
          attackInterval: 3000,
          lastAttack: 0
        });
      }
    }

    // ==============================
    // 敵の移動
    // ==============================

    function updateEnemies(now) {

      for (const enemy of enemies) {

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance = Math.hypot(dx, dy);

        if (distance > 0) {

          enemy.x += (dx / distance) * enemy.speed;
          enemy.y += (dy / distance) * enemy.speed;
        }

        // プレイヤーとの接触
        if (distance < player.size / 2 + enemy.size / 2) {

          player.hp -= enemy.damage * 0.015;

          if (player.hp <= 0) {
            player.hp = 0;
            gameOver = true;
          }
        }

        if (now - enemy.lastAttack >= enemy.attackInterval) {
          enemy.lastAttack = now;

          const attackAngle = Math.atan2(
            player.y - enemy.y,
            player.x - enemy.x
          );

          enemyBullets.push({
            x: enemy.x,
            y: enemy.y,
            vx: Math.cos(attackAngle),
            vy: Math.sin(attackAngle),
            speed: enemy.boss ? 4 : 3,
            damage: enemy.damage,
            size: enemy.boss ? 9 : 6
          });
        }
      }
    }

    // ==============================
    // 自動攻撃
    // ==============================

    function autoAttack(now) {

      if (now - player.lastAttack < player.attackInterval) {
        return;
      }

      let nearestEnemy = null;
      let nearestDistance = Infinity;

      for (const enemy of enemies) {

        const distance = Math.hypot(
          enemy.x - player.x,
          enemy.y - player.y
        );

        if (
          distance < player.attackRange &&
          distance < nearestDistance
        ) {
          nearestEnemy = enemy;
          nearestDistance = distance;
        }
      }

      if (nearestEnemy) {

        player.lastAttack = now;

        bullets.push({
          x: player.x,
          y: player.y,

          target: nearestEnemy,

          speed: 7,

          damage: player.attackDamage,

          size: 7
        });
      }
    }

    // ==============================
    // 弾を動かす
    // ==============================

    function updateBullets() {

      for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        // ターゲットがすでに倒されている場合
        if (!enemies.includes(bullet.target)) {
          bullets.splice(i, 1);
          continue;
        }

        const dx = bullet.target.x - bullet.x;
        const dy = bullet.target.y - bullet.y;

        const distance = Math.hypot(dx, dy);

        if (distance < bullet.target.size / 2) {

          bullet.target.hp -= bullet.damage;

          bullets.splice(i, 1);

          if (bullet.target.hp <= 0) {

            const enemyIndex = enemies.indexOf(bullet.target);

            // 経験値アイテムを落とす
            expItems.push({
              x: bullet.target.x,
              y: bullet.target.y,
              size: 10,
              value: bullet.target.boss ? 100 : 10
            });

            if (bullet.target.boss) {
              gameClear = true;
            }

            if (enemyIndex !== -1) {
              enemies.splice(enemyIndex, 1);
            }
          }

          continue;
        }

        bullet.x += (dx / distance) * bullet.speed;
        bullet.y += (dy / distance) * bullet.speed;
      }
    }

    function updateEnemyBullets() {

      for (let i = enemyBullets.length - 1; i >= 0; i--) {

        const bullet = enemyBullets[i];

        const dx = player.x - bullet.x;
        const dy = player.y - bullet.y;

        const distance = Math.hypot(dx, dy);

        if (distance < player.size / 2 + bullet.size) {
          player.hp -= bullet.damage;
          enemyBullets.splice(i, 1);

          if (player.hp <= 0) {
            player.hp = 0;
            gameOver = true;
          }

          continue;
        }

        bullet.x += bullet.vx * bullet.speed;
        bullet.y += bullet.vy * bullet.speed;

        if (
          bullet.x < -bullet.size ||
          bullet.x > canvas.width + bullet.size ||
          bullet.y < -bullet.size ||
          bullet.y > canvas.height + bullet.size
        ) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    // ==============================
    // 経験値取得
    // ==============================

    function updateExpItems() {

      for (let i = expItems.length - 1; i >= 0; i--) {

        const item = expItems[i];

        const distance = Math.hypot(
          item.x - player.x,
          item.y - player.y
        );

        if (distance < player.size / 2 + item.size) {

          player.exp += item.value;

          expItems.splice(i, 1);

          checkLevelUp();
        }
      }
    }

    // ==============================
    // レベルアップ
    // ==============================

    function checkLevelUp() {

      while (player.exp >= player.expToNext) {

        player.exp -= player.expToNext;

        player.level++;

        player.expToNext = Math.floor(player.expToNext * 1.4);

        // 今回は自動で少し強くする
        player.attackDamage += 5;
        player.maxHp += 10;
        player.hp = player.maxHp;

        player.speed += 0.15;
      }
    }

    // ==============================
    // 敵を定期的に出す
    // ==============================

    let lastEnemySpawn = 0;

    function handleEnemySpawning(now) {

      const elapsedSeconds =
        (now - startTime) / 1000;

      // 時間が経つほど敵の出現が少し速くなる
      const spawnInterval =
        Math.max(500, 1500 - elapsedSeconds * 6);

      if (
        now - lastEnemySpawn > spawnInterval &&
        !bossSpawned
      ) {
        spawnEnemy();
        lastEnemySpawn = now;
      }

      // 2分後にボス
      if (
        elapsedSeconds >= 120 &&
        !bossSpawned
      ) {

        bossSpawned = true;

        spawnEnemy(true);
      }
    }

    // ==============================
    // 街を描く
    // ==============================

    function drawTown() {

      // 地面
      ctx.fillStyle = "#6f8f5f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 道路
      ctx.fillStyle = "#555";

      ctx.fillRect(
        0,
        canvas.height / 2 - 55,
        canvas.width,
        110
      );

      ctx.fillRect(
        canvas.width / 2 - 60,
        0,
        120,
        canvas.height
      );

      // 道路の白線
      ctx.strokeStyle = "#ddd";
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);

      ctx.beginPath();

      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);

      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);

      ctx.stroke();

      ctx.setLineDash([]);

      // 建物
      for (const building of buildings) {

        ctx.fillStyle = "#b38b6d";

        ctx.fillRect(
          building.x,
          building.y,
          building.w,
          building.h
        );

        ctx.fillStyle = "#444";

        ctx.fillRect(
          building.x + 15,
          building.y + 15,
          30,
          30
        );

        ctx.fillRect(
          building.x + 60,
          building.y + 15,
          30,
          30
        );
      }
    }

    // ==============================
    // プレイヤー描画
    // ==============================

    function drawPlayer() {

      ctx.fillStyle = "#45aaf2";

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y,
        player.size / 2,
        0,
        Math.PI * 2
      );

      ctx.fill();

      // 攻撃範囲を薄く表示
      ctx.strokeStyle =
        "rgba(255,255,255,0.12)";

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y,
        player.attackRange,
        0,
        Math.PI * 2
      );

      ctx.stroke();
    }

    // ==============================
    // 敵描画
    // ==============================

    function drawEnemies() {

      for (const enemy of enemies) {

        ctx.fillStyle =
          enemy.boss ? "#8e44ad" : "#d63031";

        ctx.beginPath();

        ctx.arc(
          enemy.x,
          enemy.y,
          enemy.size / 2,
          0,
          Math.PI * 2
        );

        ctx.fill();

        // HPバー
        const barWidth = enemy.size;

        ctx.fillStyle = "#333";

        ctx.fillRect(
          enemy.x - barWidth / 2,
          enemy.y - enemy.size / 2 - 10,
          barWidth,
          5
        );

        ctx.fillStyle = "#2ecc71";

        ctx.fillRect(
          enemy.x - barWidth / 2,
          enemy.y - enemy.size / 2 - 10,
          barWidth *
            (enemy.hp / enemy.maxHp),
          5
        );
      }
    }

    // ==============================
    // 弾描画
    // ==============================

    function drawBullets() {

      ctx.fillStyle = "#ffeaa7";

      for (const bullet of bullets) {

        ctx.beginPath();

        ctx.arc(
          bullet.x,
          bullet.y,
          bullet.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    function drawEnemyBullets() {

      ctx.fillStyle = "#ff7675";

      for (const bullet of enemyBullets) {

        ctx.beginPath();

        ctx.arc(
          bullet.x,
          bullet.y,
          bullet.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    // ==============================
    // 経験値描画
    // ==============================

    function drawExpItems() {

      ctx.fillStyle = "#00cec9";

      for (const item of expItems) {

        ctx.beginPath();

        ctx.arc(
          item.x,
          item.y,
          item.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    // ==============================
    // UI描画
    // ==============================

    function drawUI(now) {

      const elapsedSeconds =
        Math.floor((now - startTime) / 1000);

      const minutes =
        Math.floor(elapsedSeconds / 60);

      const seconds =
        elapsedSeconds % 60;

      const timeText =
        `${minutes}:${seconds
          .toString()
          .padStart(2, "0")}`;

      ctx.fillStyle = "white";
      ctx.font = "18px sans-serif";

      ctx.fillText(
        `HP: ${Math.ceil(player.hp)} / ${player.maxHp}`,
        20,
        30
      );

      ctx.fillText(
        `Level: ${player.level}`,
        20,
        55
      );

      ctx.fillText(
        `EXP: ${player.exp} / ${player.expToNext}`,
        20,
        80
      );

      ctx.fillText(
        `Time: ${timeText}`,
        canvas.width - 130,
        30
      );

      if (!bossSpawned) {

        const remaining =
          Math.max(
            0,
            120 - elapsedSeconds
          );

        ctx.fillText(
          `Boss: ${remaining}s`,
          canvas.width - 130,
          55
        );

      } else {

        ctx.fillStyle = "#f1c40f";

        ctx.fillText(
          "BOSS!",
          canvas.width - 100,
          55
        );
      }

      // HPバー
      ctx.fillStyle = "#333";

      ctx.fillRect(
        20,
        95,
        220,
        15
      );

      ctx.fillStyle = "#e74c3c";

      ctx.fillRect(
        20,
        95,
        220 *
          (player.hp / player.maxHp),
        15
      );
    }

    // ==============================
    // ゲームオーバー
    // ==============================

    function drawEndScreen() {

      ctx.fillStyle =
        "rgba(0,0,0,0.65)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.textAlign = "center";

      if (gameClear) {

        ctx.fillStyle = "#f1c40f";
        ctx.font = "48px sans-serif";

        ctx.fillText(
          "TOWN SAVED!",
          canvas.width / 2,
          canvas.height / 2 - 30
        );

      } else {

        ctx.fillStyle = "#ff7675";
        ctx.font = "48px sans-serif";

        ctx.fillText(
          "GAME OVER",
          canvas.width / 2,
          canvas.height / 2 - 30
        );
      }

      ctx.fillStyle = "white";
      ctx.font = "22px sans-serif";

      ctx.fillText(
        "Rキーで再スタート",
        canvas.width / 2,
        canvas.height / 2 + 30
      );

      ctx.textAlign = "left";
    }

    function drawPauseScreen() {

      if (!paused) {
        return;
      }

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.font = "42px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
      ctx.font = "18px sans-serif";
      ctx.fillText("スペースで再開", canvas.width / 2, canvas.height / 2 + 38);
      ctx.textAlign = "left";
    }

    // ==============================
    // メインゲームループ
    // ==============================

    function gameLoop(now) {

      drawTown();

      if (!gameOver && !gameClear && !paused) {

        updatePlayer();

        handleEnemySpawning(now);

        updateEnemies(now);

        autoAttack(now);

        updateBullets();

        updateEnemyBullets();

        updateExpItems();
      }

      drawExpItems();

      drawBullets();

      drawEnemyBullets();

      drawEnemies();

      drawPlayer();

      drawUI(now);

      drawPauseScreen();

      if (gameOver || gameClear) {
        drawEndScreen();
      }

      requestAnimationFrame(gameLoop);
    }

    // ==============================
    // ゲーム開始
    // ==============================

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
```
